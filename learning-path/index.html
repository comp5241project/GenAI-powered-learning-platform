<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f5f1">
  <meta name="description" content="SkillLoop: short software development lessons, personalised paths, interview practice and AI correction challenges.">
  <title>My path | SkillLoop</title>
  <link rel="icon" href="../public/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../shared/styles.css">
  <link rel="stylesheet" href="style.css">
  <script src="../shared/vendor/lucide.min.js" defer></script>
  <script src="../shared/storage.js" defer></script>
  <script src="../shared/navigation.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body data-root="../" data-module="learning-path">
  <a class="skip-link" href="#main-content">Skip to content</a>
  <div id="skillloop-prototype">
    <header id="site-header" class="sl-head"></header>
    <div class="sl-shell">
      <aside id="site-navigation" class="sl-side" aria-label="Workspace navigation"></aside>
      <main id="main-content" class="sl-main">
<div class="sl-kicker">Personalised learning</div>
<h1>Your path starts here.</h1>
<p class="sl-intro">Match the next step to where you are.</p>
<div class="sl-card">
<div class="sl-icon-title" style="margin-bottom:17px">
<i data-lucide="sliders-horizontal" aria-hidden="true">
</i>
<h3>Set your starting point</h3>
</div>
<div class="sl-grid" style="margin-top:0">
<div>
<label for="sl-background">Experience</label>
<select id="sl-background">
<option value="beginner">New to programming</option>
<option value="student">Some coding experience</option>
<option value="graduate">Preparing for interviews</option>
</select>
</div>
<div>
<label for="sl-goal">Goal</label>
<select id="sl-goal">
<option value="internship">Software internship</option>
<option value="build">Build with AI</option>
</select>
</div>
</div>
<div class="sl-message">
<div class="sl-kicker" style="margin-bottom:9px">Quick check</div>
<p>Code runs without errors. Is it necessarily correct?</p>
<div class="sl-row" style="justify-content:flex-start;margin-top:13px">
<button type="button" class="sl-btn" data-diagnostic="no">No. Check its results.</button>
<button type="button" class="sl-btn" data-diagnostic="yes">Yes, it works.</button>
</div>
<div id="sl-diagnostic-result" class="sl-small" aria-live="polite" style="margin-top:10px">Choose an answer to refine your path.</div>
</div>
<button type="button" class="sl-btn sl-btn-main" id="sl-make-path">Build my path<i data-lucide="arrow-right" aria-hidden="true">
</i>
</button>
</div>
<div class="sl-card sl-spaced" aria-live="polite">
<div class="sl-row">
<h3>Your next steps</h3>
<span class="sl-chip">Sample recommendation</span>
</div>
<div id="sl-path-list">
</div>
<div id="sl-path-title" class="sl-small" style="margin:12px 0">
</div>
<a class="sl-btn" href="../knowledge-map/">Explore skill map<i data-lucide="arrow-up-right" aria-hidden="true">
</i>
</a>
</div>
      </main>
    </div>
  </div>
  <noscript>Please enable JavaScript to use the interactive exercises. <a href="../index.html">Home</a></noscript>
</body>
</html>
